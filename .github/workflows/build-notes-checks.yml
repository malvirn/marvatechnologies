name: Build Notes checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, tests, types and static builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependency tree
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build static site with no published lessons
        run: npm run build
        env:
          SITE_URL: https://marvatechnologies.pages.dev

      - name: Inspect exported Build Notes assets
        run: find out/insights -maxdepth 4 -type f -printf '%P\\n' | sort

      - name: Verify zero and one published lesson exports
        run: node scripts/verify-insights-build-modes.mjs
        env:
          SITE_URL: https://marvatechnologies.pages.dev

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run test:e2e
        env:
          SITE_URL: https://marvatechnologies.pages.dev
          E2E_LESSON_SLUG: audit-before-you-modify
          E2E_LESSON_TITLE: "Audit before you modify: prompting AI against an existing codebase"
          E2E_TEACHING_LESSON_SLUG: audit-before-you-modify
