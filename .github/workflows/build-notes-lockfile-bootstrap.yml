name: Build Notes lockfile bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add npm lockfile"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: build-notes-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
